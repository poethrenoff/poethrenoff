parameters:
    app.vote_salt: '%env(resolve:APP_VOTE_SALT)%'

# Parameters for the current project Kilo
# See https://kilo.ai/docs/default-agent/t/config/parameter-overrides for more info.

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Sonata Admin Service Configurations using FQCN
    # Each admin now includes the required "model_class" attribute.

    # StaticTextAdmin
    App\Admin\StaticTextAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: Сайт, label: Тексты, model_class: App\Entity\StaticText, priority: 20 }

    # UserAdmin
    App\Admin\UserAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: Сайт, label: Пользователи, model_class: App\Entity\User, priority: 10 }

    # PostAdmin
    App\Admin\BlogPostAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: Блог, label: Новости, model_class: App\Entity\BlogPost, priority: 30 }

    # BlogCommentAdmin
    App\Admin\BlogCommentAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: Блог, label: Комментарии, model_class: App\Entity\BlogComment, priority: 20 }

    # TagAdmin
    App\Admin\TagAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: Блог, label: Теги, model_class: App\Entity\Tag, priority: 10 }

    # PoemAdmin
    App\Admin\PoemAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: Мастерская, label: Черновики, model_class: App\Entity\Poem, priority: 20 }

    # AudioAdmin
    App\Admin\AudioAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: Мастерская, label: Записи, model_class: App\Entity\Audio, priority: 10 }

    # WorkGroupAdmin
    App\Admin\WorkGroupAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: Произведения, label: Разделы, model_class: App\Entity\WorkGroup, priority: 50 }

    # WorkAdmin
    App\Admin\WorkAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: Произведения, label: Произведения, model_class: App\Entity\Work, priority: 40 }

    # WorkCommentAdmin
    App\Admin\WorkCommentAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: Произведения, label: Комментарии, model_class: App\Entity\WorkComment, priority: 30 }

    # PictureAdmin
    App\Admin\PictureAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: Произведения, label: Картинки, model_class: App\Entity\Picture, priority: 20 }

    # WorkVoteAdmin
    App\Admin\WorkVoteAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: Произведения, label: Голоса, model_class: App\Entity\WorkVote, priority: 10 }
