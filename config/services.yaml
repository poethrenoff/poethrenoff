parameters:

# Parameters for the current project Kilo
# See https://kilo.ai/docs/default-agent/t/config/parameter-overrides for more info.

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Sonata Admin Service Configurations using FQCN
    # Each admin now includes the required "model_class" attribute.

    # UserAdmin
    App\Admin\UserAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: admin, label: User, model_class: App\Entity\User }

    # TagAdmin
    App\Admin\TagAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: blog, label: Tags, model_class: App\Entity\Tag }

    # PostAdmin (BlogPost)
    App\Admin\BlogPostAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: blog, label: Posts, model_class: App\Entity\BlogPost }

    # BlogCommentAdmin
    App\Admin\BlogCommentAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: blog, label: Comments, model_class: App\Entity\BlogComment }

    # PoemAdmin
    App\Admin\PoemAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: poems, label: Poems, model_class: App\Entity\Poem }

    # WorkGroupAdmin
    App\Admin\WorkGroupAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: work, label: Groups, model_class: App\Entity\WorkGroup }

    # WorkAdmin
    App\Admin\WorkAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: work, label: Works, model_class: App\Entity\Work }

    # WorkCommentAdmin
    App\Admin\WorkCommentAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: work, label: Comments, model_class: App\Entity\WorkComment }

    # WorkVoteAdmin
    App\Admin\WorkVoteAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: work, label: Votes, model_class: App\Entity\WorkVote }

    # AudioAdmin
    App\Admin\AudioAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: media, label: Audio, model_class: App\Entity\Audio }

    # PictureAdmin
    App\Admin\PictureAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: media, label: Pictures, model_class: App\Entity\Picture }

    # StaticTextAdmin
    App\Admin\StaticTextAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: site, label: Static Texts, model_class: App\Entity\StaticText }
