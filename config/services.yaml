parameters:
    app.vote_salt: '%env(resolve:APP_VOTE_SALT)%'

# Parameters for the current project Kilo
# See https://kilo.ai/docs/default-agent/t/config/parameter-overrides for more info.

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Admin/'
            - '../src/Kernel.php'

    # Sonata Admin Service Configurations using FQCN
    # Each admin now includes the required "model_class" attribute.

    # StaticTextAdmin
    App\Admin\StaticTextAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: common, label: Тексты, model_class: App\Entity\StaticText }

    # UserAdmin
    App\Admin\UserAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: common, label: Пользователи, model_class: App\Entity\User }

    # PostAdmin
    App\Admin\BlogPostAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: blog, label: Новости, model_class: App\Entity\BlogPost }

    # BlogCommentAdmin
    App\Admin\BlogCommentAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: blog, label: Комментарии, model_class: App\Entity\BlogComment }

    # TagAdmin
    App\Admin\TagAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: blog, label: Теги, model_class: App\Entity\Tag }

    # PoemAdmin
    App\Admin\PoemAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: work, label: Черновики, model_class: App\Entity\Poem }
        calls:
            - [addChild, ['@App\Admin\PoemVersionAdmin', 'poem']]

    # PoemVersionAdmin
    App\Admin\PoemVersionAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, model_class: App\Entity\PoemVersion }

    # AudioAdmin
    App\Admin\AudioAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: work, label: Записи, model_class: App\Entity\Audio }

    # WorkGroupAdmin
    App\Admin\WorkGroupAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: site, label: Разделы, model_class: App\Entity\WorkGroup }

    # WorkAdmin
    App\Admin\WorkAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: site, label: Произведения, model_class: App\Entity\Work }

    # WorkCommentAdmin
    App\Admin\WorkCommentAdmin:
        public: true
        calls:
            - [setTemplate, [layout, admin/layout.html.twig]]
        tags:
            - { name: sonata.admin, manager_type: orm, group: site, label: Комментарии, model_class: App\Entity\WorkComment }

    # PictureAdmin
    App\Admin\PictureAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: site, label: Картинки, model_class: App\Entity\Picture }

    # WorkVoteAdmin
    App\Admin\WorkVoteAdmin:
        public: true
        tags:
            - { name: sonata.admin, manager_type: orm, group: site, label: Голоса, model_class: App\Entity\WorkVote}
