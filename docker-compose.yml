services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: >
      bash -c '
        until bin/console dbal:run-sql "SELECT 1" > /dev/null 2>&1; do sleep 3; done;
        php bin/console doctrine:migrations:migrate --no-interaction
        php bin/console doctrine:fixtures:load --no-interaction
        php bin/console cache:clear --no-interaction
        php-fpm
      '
    volumes:
      - .:/var/www/symfony
    depends_on:
      - mysql
    networks:
      - symfony_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/symfony
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - symfony_net

  mysql:
    image: mysql:8.4
    ports:
        - "3306:3306"
    environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: poethrenoff
        MYSQL_USER: poethrenoff
        MYSQL_PASSWORD: poethrenoff
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - symfony_net

volumes:
  mysql-data:

networks:
  symfony_net:
    external: true
